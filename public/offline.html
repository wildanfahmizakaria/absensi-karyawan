<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Offline — Sistem Absensi CV Mandala Mahardika</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F5F8FF;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #FFFFFF;
      max-width: 420px;
      width: 100%;
      border-radius: 1.25rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1);
      border: 1px solid #E2E8F0;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background: #EFF6FF;
      color: #2563EB;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #2563EB;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    .footer-note {
      font-size: 0.75rem;
      color: #94A3B8;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Perangkat Sedang Offline</h1>
    <p>
      Sistem absensi CV Mandala Mahardika membutuhkan koneksi internet aktif untuk memverifikasi swafoto kamera live dan merekam koordinat GPS ke server.
    </p>
    <button class="btn" onclick="window.location.reload()">Coba Sambungkan Ulang</button>
    <div class="footer-note">CV Mandala Mahardika — Presensi Karyawan SOT v0.2</div>
  </div>
</body>
</html>
